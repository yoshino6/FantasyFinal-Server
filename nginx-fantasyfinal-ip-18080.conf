# 独立的 IP 测试入口；与 fantasyfinal.conf 并存。
# 安装到 /etc/nginx/conf.d/fantasyfinal-ip-18080.conf。
server {
    listen 18080;
    server_name 1.12.245.238;

    root /var/www/fantasyfinal;
    index index.html;

    # 网页聊天 WebSocket
    location = /api/web/v1/realtime {
        proxy_pass http://127.0.0.1:17119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    # 网页游戏 API；与页面使用同一个 IP 和端口。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:17119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        # 每次进入都重新验证入口文件，以便发现新的构建哈希。
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /sw.js {
        # HTTPS 域名恢复后，浏览器也能及时检查 Service Worker 更新。
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Vite 构建产物的文件名包含内容哈希；新版本会使用新的 URL。
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # public/assets 中的图片、音频等保留原文件名；短期缓存避免重进时重复下载。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }
}
