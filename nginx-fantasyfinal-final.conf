# 申请证书后使用的最终配置。
# 放到 /etc/nginx/conf.d/fantasyfinal.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name fantasyfinal.net www.fantasyfinal.net;
    return 301 https://fantasyfinal.net$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.fantasyfinal.net;

    ssl_certificate /etc/letsencrypt/live/fantasyfinal.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fantasyfinal.net/privkey.pem;
    return 301 https://fantasyfinal.net$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fantasyfinal.net;

    ssl_certificate /etc/letsencrypt/live/fantasyfinal.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fantasyfinal.net/privkey.pem;

    root /var/www/fantasyfinal;
    index index.html;

    # 管理后台页面和封面
    location = /admin {
        proxy_pass http://127.0.0.1:17118;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:17118;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台 API 必须先于通用 /api/ 规则
    location = /api/admin {
        proxy_pass http://127.0.0.1:17118;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:17118;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 网页聊天 WebSocket
    location /api/web/v1/realtime {
        proxy_pass http://127.0.0.1:17119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    # 网页游戏和桌宠 API
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:17119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue history 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
