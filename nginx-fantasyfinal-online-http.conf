# online.fantasyfinal.net 首次申请证书时使用。
# 安装为 /etc/nginx/conf.d/fantasyfinal-online.conf；证书签发后用 HTTPS 配置替换。
server {
    listen 80;
    server_name online.fantasyfinal.net;

    # certbot --webroot -w /var/www/letsencrypt 使用此目录完成 HTTP-01 验证。
    root /var/www/letsencrypt;
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / { return 404; }
}
