# online.fantasyfinal.net 的正式 HTTPS 入口。
# 证书存在后安装为 /etc/nginx/conf.d/fantasyfinal-online.conf。
# 此文件由 nginx.conf 的 http { include /etc/nginx/conf.d/*.conf; } 加载。
map $http_upgrade $ff_online_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name online.fantasyfinal.net;

    root /var/www/letsencrypt;
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location / { return 301 https://online.fantasyfinal.net$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name online.fantasyfinal.net;

    ssl_certificate /etc/letsencrypt/live/online.fantasyfinal.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/online.fantasyfinal.net/privkey.pem;

    root /var/www/fantasyfinal;
    index index.html;

    # 后台页面和静态资源由 17118 提供。
    location = /admin {
        proxy_pass http://127.0.0.1:17118;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:17118;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台 API 必须先于通用 /api/ 规则。
    location = /api/admin {
        proxy_pass http://127.0.0.1:17118;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:17118;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web 实时连接需要显式转发 WebSocket 升级头。
    location = /api/web/v1/realtime {
        proxy_pass http://127.0.0.1:17119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ff_online_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    # 网页游戏 API 与页面同域，浏览器无需跨域配置。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:17119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /game-assets.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Vite 带内容哈希的 JS/CSS/字体可长期缓存；不存在时必须返回 404。
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 原文件名图片、音频按短期缓存；缺失资源不能回退到首页。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
